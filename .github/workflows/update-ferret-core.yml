name: Update Ferret Core

on:
  repository_dispatch:
    types: [ferret-core-released]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      base-sha: ${{ steps.base.outputs.sha }}
      changed: ${{ steps.dependency.outputs.changed }}
    env:
      FERRET_VERSION: ${{ github.event.client_payload.version }}
    steps:
      - name: Validate dispatch payload
        shell: bash
        run: |
          set -euo pipefail

          semver_pattern='^v2\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$FERRET_VERSION" =~ $semver_pattern ]]; then
            echo "::error title=Invalid Ferret release version::Expected a v2 SemVer tag, got '$FERRET_VERSION'."
            exit 1
          fi

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Record validated base commit
        id: base
        shell: bash
        run: |
          set -euo pipefail

          base_sha="$(git rev-parse HEAD)"
          if [[ ! "$base_sha" =~ ^([0-9A-Fa-f]{40}|[0-9A-Fa-f]{64})$ ]]; then
            echo "::error title=Invalid base commit::Expected a 40- or 64-character commit ID."
            exit 1
          fi

          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Update Ferret Core dependency
        id: dependency
        shell: bash
        run: |
          set -euo pipefail

          go get "github.com/MontFerret/ferret/v2@${FERRET_VERSION}"
          go mod tidy
          git add -- go.mod go.sum

          if git diff --cached --quiet -- go.mod go.sum; then
            echo "Ferret Core is already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        if: steps.dependency.outputs.changed == 'true'
        run: go test ./...

      - name: Build
        if: steps.dependency.outputs.changed == 'true'
        run: make compile

      - name: Validate prepared dependency update
        if: steps.dependency.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          staged_files="$(git diff --cached --name-only)"
          if [[ -z "$staged_files" ]]; then
            echo "::error title=Missing dependency update::Expected go.mod or go.sum to be staged."
            exit 1
          fi

          while IFS= read -r staged_file; do
            case "$staged_file" in
              go.mod | go.sum)
                ;;
              *)
                echo "::error title=Unexpected dependency update::Only go.mod and go.sum may be staged."
                exit 1
                ;;
            esac
          done <<< "$staged_files"

          if ! git diff --quiet; then
            echo "::error title=Unexpected generated changes::Validation modified tracked files outside the staged dependency update."
            git status --short
            exit 1
          fi

          git diff --cached --check

      - name: Upload validated dependency files
        if: steps.dependency.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ferret-core-dependency-update
          path: |
            go.mod
            go.sum
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Ferret Core update
    needs: prepare
    if: ${{ needs.prepare.outputs.changed == 'true' }}
    uses: MontFerret/.github/.github/workflows/publish-ferret-core-update.yml@main
    with:
      version: ${{ github.event.client_payload.version }}
      base-sha: ${{ needs.prepare.outputs.base-sha }}
    secrets:
      FERRET_RELEASE_APP_CLIENT_ID: ${{ secrets.FERRET_RELEASE_APP_CLIENT_ID }}
      FERRET_RELEASE_APP_PRIVATE_KEY: ${{ secrets.FERRET_RELEASE_APP_PRIVATE_KEY }}
